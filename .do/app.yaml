# DigitalOcean App Platform — Node web service (static + /admin SEO)
# doctl apps create --spec .do/app.yaml
name: rebekah-cleans-lane-county
region: nyc
services:
  - name: web
    github:
      repo: ndybiehl/rebekah-cleans-lane-county
      branch: main
      deploy_on_push: true
    source_dir: /
    environment_slug: node-js
    instance_count: 1
    instance_size_slug: basic-xxs
    http_port: 3000
    routes:
      - path: /
    envs:
      - key: NODE_ENV
        value: production
      - key: PUBLIC_SITE_URL
        value: https://rebekahcleanslanecounty.com
      # Set these as SECRET in the DO dashboard (do not commit real values):
      # SESSION_SECRET, ADMIN_PASSWORD_HASH
      - key: ADMIN_EMAIL
        value: rebekahcleaning@gmail.com
      - key: GA4_MEASUREMENT_ID
        value: G-Z7SYCSYNN9
      - key: GA4_PROPERTY_ID
        value: "547446420"
      - key: GA4_ACCOUNT_ID
        value: "402544998"
      - key: GA4_STREAM_ID
        value: "15341565315"
      # SECRET in DO dashboard (full service account JSON, one line):
      # GA4_SERVICE_ACCOUNT_JSON
    health_check:
      http_path: /healthz
